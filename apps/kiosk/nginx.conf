server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The page itself is always revalidated, so a deploy reaches every screen (useAutoUpdate in keepalive.ts).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's bundles are named after their content and never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Official icons change only when scripts/fetch_official_icons.py refreshes them.
    location ~ ^/(official|status)/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
