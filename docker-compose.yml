services:
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    environment:
      SNAPSHOT_TTL_SEC: "60"
      STALE_AFTER_SEC: "600"
      ENABLE_SIM: "true"
      ENABLE_LIVE_POLLER: "true"
  web:
    build:
      context: .
      dockerfile: apps/kiosk/Dockerfile
    restart: unless-stopped
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - ingest
      - web
